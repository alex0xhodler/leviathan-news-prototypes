name: Refresh Leviathan fixtures

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h at :17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest API snapshots
        run: |
          set -e
          mkdir -p shared/fixtures
          curl -sf --max-time 30 "https://api.leviathannews.xyz/api/v1/news/?sort_type=hot&sort_timeframe=7&limit=12" -o shared/fixtures/news.json
          curl -sf --max-time 30 "https://api.leviathannews.xyz/api/v1/leaderboards/rotating/" -o shared/fixtures/leaderboards.json
          curl -sf --max-time 30 "https://api.leviathannews.xyz/api/v1/intel/trending/?hours=24&top_n=15" -o shared/fixtures/trending.json
          # validate: must be non-trivial JSON
          for f in shared/fixtures/*.json; do
            jq -e . "$f" > /dev/null
            test "$(wc -c < "$f")" -gt 500
          done
          echo "fixtures refreshed at $(date -u +%FT%TZ)"

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(fixtures): refresh Leviathan API snapshots"
          file_pattern: "shared/fixtures/*.json"
